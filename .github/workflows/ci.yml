name: CI

on:
  push:
    branches: [ master, ci ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            flex_package: flex
            bison_package: bison
          - os: macos-latest
            flex_package: flex
            bison_package: bison
          - os: windows-latest
            flex_package: winflexbison3
            bison_package: ""

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install flex bison
        echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
        echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install winflexbison3 -y

    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd build
        make -j$(nproc)

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build
        cmake --build . --config Release

    - name: Sanity check (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        echo 'void main() { Print("hello from CI"); }' | ./build/dcc
        echo "Sanity check passed"

    - name: Sanity check (Windows)
      if: runner.os == 'Windows'
      run: |
        echo 'void main() { Print("hello from CI"); }' | .\build\Release\dcc.exe
        echo "Sanity check passed"

    - name: Run full test suite (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd build
        ctest --output-on-failure || true

    - name: Run full test suite (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build
        ctest -C Release --output-on-failure || true

    - name: Run detailed tests (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        DCC=$(pwd)/build/dcc python3 tests/run_tests.py tests || true

    - name: Run detailed tests (Windows)
      if: runner.os == 'Windows'
      run: |
        $env:DCC = "$(pwd)\build\Release\dcc.exe"
        python tests/run_tests.py tests || true
